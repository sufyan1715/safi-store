<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safi Store</title>
<style>
:root{--bg:#f8fafc;--s:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--g:#059669}
@media(prefers-color-scheme:dark){:root{--bg:#0b1120;--s:#111827;--t:#e5e7eb;--m:#94a3b8;--b:#1f2937}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--s);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
main{max-width:1100px;margin:0 auto;padding:16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;height:150px;object-fit:cover;border-radius:10px}
h3{margin:0;font-size:15px}.pr{margin:0;color:var(--g);font-weight:700}.mut,small{color:var(--m)}
button{font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:9px 14px;border:1px solid var(--b);background:var(--s);color:var(--t);cursor:pointer}
.pri,.card button{background:var(--g);color:#fff;border:0}
input,textarea{width:100%;font:inherit;font-size:14px;padding:10px;margin:4px 0;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t)}
#md{position:fixed;inset:0;background:rgba(2,6,23,.7);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
#md[hidden]{display:none}
.box{background:var(--s);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}
.tot{font-weight:700;font-size:17px}.err{color:#ef4444;font-size:13px;min-height:18px}.sel{outline:2px solid var(--g)}
</style>
</head>
<body>
<header><b>Safi Store</b><button id="cb">Cart (<span id="cn">0</span>)</button></header>
<main><div id="grid"><p class="mut">Loading products...</p></div></main>
<div id="md" hidden><div class="box"><div id="mb"></div><p><button onclick="closeM()" style="width:100%">Close</button></p></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,getDocs,getDoc,doc,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyA_jgYlILvsm9BkBGWf41U2TCTjeY82R34",authDomain:"safi-store17.firebaseapp.com",projectId:"safi-store17",storageBucket:"safi-store17.firebasestorage.app",messagingSenderId:"62886587773",appId:"1:62886587773:web:5d22bf939498c9a137b014"}));
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₨ '+Number(n).toLocaleString();
let P=[],G={},M='',C={};try{C=JSON.parse(localStorage.getItem('safi_cart'))||{}}catch(e){}
const sv=()=>{try{localStorage.setItem('safi_cart',JSON.stringify(C))}catch(e){}$('cn').textContent=Object.values(C).reduce((a,b)=>a+b,0)};
const show=h=>{$('mb').innerHTML=h;$('md').hidden=false},closeM=()=>{$('md').hidden=true},err=m=>{$('er').textContent=m};
function grid(){$('grid').innerHTML=P.length?P.map(p=>`<div class="card">${/^https:\/\//.test(p.img||'')?`<img src="${esc(p.img)}" alt="">`:''}<h3>${esc(p.name)}</h3><p class="pr">${money(p.price)}</p><button onclick="add('${p.id}')">Add to cart</button></div>`).join(''):'<p class="mut">No products yet. Please check back soon.</p>'}
function add(id){C[id]=(C[id]||0)+1;sv()}
function qty(id,d){C[id]=(C[id]||0)+d;if(C[id]<1)delete C[id];sv();cart()}
const lines=()=>Object.keys(C).map(id=>({p:P.find(x=>x.id===id),q:C[id]})).filter(x=>x.p),total=()=>lines().reduce((a,x)=>a+x.p.price*x.q,0);
function cart(){const L=lines();show('<h2>Your cart</h2>'+(L.length?L.map(x=>`<div class="row"><span>${esc(x.p.name)}<br><small>${money(x.p.price)}</small></span><span><button onclick="qty('${x.p.id}',-1)">−</button> ${x.q} <button onclick="qty('${x.p.id}',1)">+</button></span></div>`).join('')+`<p class="tot">Total ${money(total())}</p><button class="pri" style="width:100%" onclick="co()">Checkout</button>`:'<p>Your cart is empty.</p>'))}
function co(){const on=Object.keys(G).filter(k=>G[k].on&&G[k].num);if(!on.length)return show('<h2>Checkout</h2><p>Online payment is not available right now. Please try again later.</p>');M=on[0];
 show(`<h2>Checkout</h2><input id="nm" placeholder="Your name" maxlength="80"><input id="ph" inputmode="tel" placeholder="Mobile number, like 03001234567"><textarea id="ad" rows="2" placeholder="Full delivery address" maxlength="300"></textarea><p class="tot">Pay ${money(total())} to:</p><div style="display:flex;gap:8px">${on.map(k=>`<button id="m-${k}" style="flex:1" onclick="pick('${k}')">${k}</button>`).join('')}</div><p id="gi"></p><input id="tid" placeholder="Transaction ID from your payment slip" maxlength="40"><p id="er" class="err"></p><button id="pb" class="pri" style="width:100%" onclick="place()">Place order</button>`);pick(M)}
function pick(k){M=k;Object.keys(G).forEach(x=>{const b=$('m-'+x);if(b)b.className=x===k?'sel':''});$('gi').innerHTML=`Send the money to <b>${esc(G[k].num)}</b> (${esc(G[k].title)}), then enter the Transaction ID below.`}
async function place(){const v=id=>$(id).value.trim(),ph=v('ph').replace(/[\s-]/g,''),L=lines();
 if(!v('nm'))return err('Enter your name.');if(!/^(\+92|0)3\d{9}$/.test(ph))return err('Enter a valid mobile number, like 03001234567.');if(v('ad').length<8)return err('Enter your full delivery address.');if(!/^[A-Za-z0-9]{6,40}$/.test(v('tid')))return err('Transaction ID needs 6 to 40 letters or numbers.');if(!L.length)return err('Your cart is empty.');
 $('pb').disabled=true;err('');
 try{const r=await addDoc(collection(db,'orders'),{items:L.map(x=>({id:x.p.id,name:x.p.name,price:x.p.price,qty:x.q})),total:total(),name:v('nm'),phone:ph,address:v('ad'),method:M,tid:v('tid'),status:'PENDING',ts:serverTimestamp()});
  C={};sv();show(`<h2>Order received</h2><p>Your order number is <b>${r.id.slice(0,6).toUpperCase()}</b>. We will confirm after checking your payment.</p>`)}
 catch(e){$('pb').disabled=false;err('Could not place the order. Check your connection and try again.')}}
Object.assign(window,{add,qty,cart,co,pick,place,closeM});
$('cb').onclick=cart;sv();
try{P=(await getDocs(collection(db,'products'))).docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.active!==false&&p.price>0);const s=await getDoc(doc(db,'settings','payments'));G=s.exists()?s.data():{};grid()}
catch(e){$('grid').innerHTML='<p class="mut">Could not load products. Please refresh the page.</p>'}
</script>
</body>
</html>
