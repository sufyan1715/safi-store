<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Safi Store Admin</title>
<style>
:root{--bg:#f1f5f9;--s:#fff;--t:#0f172a;--m:#64748b;--b:#e2e8f0;--g:#059669}
@media(prefers-color-scheme:dark){:root{--bg:#0b1120;--s:#111827;--t:#e5e7eb;--m:#94a3b8;--b:#1f2937}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0f172a;color:#fff}
main{max-width:900px;margin:0 auto;padding:14px}nav{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:13px;font-weight:600;border-radius:10px;padding:8px 12px;border:1px solid var(--b);background:var(--s);color:var(--t);cursor:pointer;white-space:nowrap}
.on,.pri{background:var(--g);color:#fff;border:0}.no{color:#ef4444}
input{width:100%;font:inherit;font-size:14px;padding:10px;margin:4px 0;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t)}
p{margin:6px 0}.mut{color:var(--m)}code{background:var(--bg);padding:2px 6px;border-radius:6px}.st{font-size:12px;font-weight:700}
#login{max-width:340px;margin:12vh auto;padding:0 14px}[hidden]{display:none!important}
.tg{width:46px;height:26px;border-radius:99px;padding:3px;background:var(--b);border:0;position:relative}.tg i{display:block;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}.tg.on{background:var(--g)}.tg.on i{transform:translateX(20px)}.live{color:var(--g);font-size:12px;font-weight:700}
select{width:100%;font:inherit;font-size:14px;padding:10px;margin:4px 0;border:1px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t)}.lb{display:block;margin-top:10px;font-size:13px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g3 .card{margin:0 0 10px}
</style>
</head>
<body>
<div id="login"><div class="card"><h2>Admin sign in</h2><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><p id="le" class="no"></p><button class="pri" style="width:100%" onclick="signin()">Sign in</button></div></div>
<div id="app" hidden><header><b>Safi Store Admin</b><button onclick="out()">Sign out</button></header><main><nav id="nav"></nav><div id="v"></div></main></div>
<input id="pf2" type="file" accept="image/*" hidden>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,writeBatch,where}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyA_jgYlILvsm9BkBGWf41U2TCTjeY82R34",authDomain:"safi-store17.firebaseapp.com",projectId:"safi-store17",storageBucket:"safi-store17.firebasestorage.app",messagingSenderId:"62886587773",appId:"1:62886587773:web:5d22bf939498c9a137b014"}),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'₨ '+Number(n||0).toLocaleString();
let T='orders',O=[],PR=[],G={},SITE={},ST={},ON=0,vu=null,Q='',subs=[],idle,fails=0,lock=0;
const TABS={orders:'Orders',visits:'Visitors',prods:'Products',look:'Store look',pay:'Payment accounts'};
async function signin(){if(Date.now()<lock)return $('le').textContent='Too many attempts. Wait 30 seconds.';
 try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value);fails=0}catch(e){if(++fails>=5){lock=Date.now()+30000;fails=0}$('le').textContent='Wrong email or password.'}}
const out=()=>signOut(auth);
onAuthStateChanged(auth,u=>{subs.forEach(f=>f());subs=[];if(vu){vu();vu=null}$('login').hidden=!!u;$('app').hidden=!u;if(!u)return;
 subs.push(onSnapshot(query(collection(db,'orders'),orderBy('ts','desc')),s=>{O=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>alert('Cannot read orders. Check that your admin email is in the Firestore rules.')));
 subs.push(onSnapshot(collection(db,'products'),s=>{PR=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
 subs.push(onSnapshot(doc(db,'settings','payments'),s=>{G=s.exists()?s.data():{};render()}));
 subs.push(onSnapshot(doc(db,'settings','site'),s=>{SITE=s.exists()?s.data():{};render()}));
 subs.push(onSnapshot(collection(db,'stats'),s=>{ST={};s.docs.forEach(d=>{ST[d.id]=d.data().n||0});render()},()=>{}));watchOnline()});
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,()=>{clearTimeout(idle);idle=setTimeout(()=>auth.currentUser&&signOut(auth),600000)}));
function render(){if(document.activeElement&&/INPUT/.test(document.activeElement.tagName)&&document.activeElement.id!=='q')return;
 $('nav').innerHTML=Object.keys(TABS).map(k=>`<button class="${k===T?'on':''}" onclick="T='${k}';render()">${TABS[k]}</button>`).join('');$('v').innerHTML=V[T]()}
const V={
orders(){const q=Q.toLowerCase(),L=O.filter(o=>!q||(o.id+o.name+o.phone+o.tid).toLowerCase().includes(q)),rev=O.filter(o=>o.status==='PAID'||o.status==='DELIVERED').reduce((a,o)=>a+(+o.total||0),0);
 return`<p>Verified revenue <b>${money(rev)}</b> · Pending <b>${O.filter(o=>o.status==='PENDING').length}</b></p><input id="q" placeholder="Search name, phone, order or TID" value="${esc(Q)}" onchange="Q=this.value;render()">`+(L.map(o=>{const dup=O.some(x=>x!==o&&String(x.tid).toLowerCase()===String(o.tid).toLowerCase());
 return`<div class="card"><div class="row"><b>${esc(o.id.slice(0,6).toUpperCase())}</b><span class="st">${esc(o.status)}</span></div><p>${esc(o.name)}<br>${esc(o.phone)}<br>${esc(o.address)}</p><p class="mut">${(o.items||[]).map(i=>esc(i.name)+' ×'+esc(i.qty)).join(', ')}</p><p><b>${money(o.total)}</b> via ${esc(o.method)}<br>${o.method==='Cash on Delivery'?'<b>Collect cash from the customer on delivery</b>':`TID <code>${esc(o.tid)}</code>${dup?' <b class="no">duplicate TID</b>':''}`}</p><div class="row" style="justify-content:flex-start">${o.status==='PENDING'?`<button class="pri" onclick="st('${o.id}','${o.method==='Cash on Delivery'?'CONFIRMED':'PAID'}')">${o.method==='Cash on Delivery'?'Confirm order':'Approve'}</button><button onclick="st('${o.id}','REJECTED')">Reject</button>`:(o.status==='PAID'||o.status==='CONFIRMED')?`<button class="pri" onclick="st('${o.id}','DELIVERED')">Mark delivered</button>`:''}</div></div>`}).join('')||'<p class="mut">No orders yet.</p>')},
prods(){return`<div class="card"><input id="pn" placeholder="Product name" maxlength="80"><input id="pp" type="number" min="1" step="any" placeholder="Price"><input id="po" type="number" min="1" step="any" placeholder="Old price (optional, shows a sale badge)"><input id="pc" placeholder="Category, like Toys (optional)" maxlength="30"><input id="ps" placeholder="Sub-category, like Cars (optional)" maxlength="30"><p class="mut">Product photo</p><input id="pf" type="file" accept="image/*"><input id="pi" placeholder="Or paste an image link (https://...)"><label class="mut" style="display:block;margin:6px 0"><input type="checkbox" id="ph" style="width:auto"> Add as hidden (not shown in store yet)</label><button class="pri" onclick="addP()">Add product</button></div>`+(sortP().map(p=>`<div class="card row"${p.active===false?' style="opacity:.65"':''}><span>${okImg(p.img)?`<img src="${esc(p.img)}" style="width:44px;height:44px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px">`:''}<b>${esc(p.name)}</b><br>${money(p.price)}${p.oldPrice?` <s class="mut">${money(p.oldPrice)}</s>`:''}${p.category?` · ${esc(p.category)}${p.subcategory?' › '+esc(p.subcategory):''}`:''} <br><span class="${p.active===false?'no':'live'}">${p.active===false?'● Hidden from store':'● Live in store'}</span></span><span><button onclick="moveP('${p.id}',-1)">↑</button> <button onclick="moveP('${p.id}',1)">↓</button> <button onclick="sizeP('${p.id}')">${p.big?'Big':'Normal'}</button> <button onclick="pickImg('${p.id}')">Photo</button> <button onclick="editP('${p.id}')">Edit</button> <button class="tg ${p.active===false?'':'on'}" onclick="hideP('${p.id}')" aria-label="Show or hide in store"><i></i></button> <button class="no" onclick="delP('${p.id}')">Delete</button></span></div>`).join('')||'<p class="mut">No products yet. Add your first product above.</p>')},
visits(){const k=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA')},days=[6,5,4,3,2,1,0].map(n=>[k(n),ST[k(n)]||0]),mx=Math.max(1,...days.map(x=>x[1])),all=Object.values(ST).reduce((a,b)=>a+b,0),wk=days.reduce((a,x)=>a+x[1],0);
 return`<div class="card"><p class="mut" style="margin:0">Online now</p><p style="font-size:46px;font-weight:800;margin:4px 0"><span class="live">●</span> ${ON}</p><p class="mut" style="margin:0">People on your store right now. Updates every 20 seconds.</p></div><div class="g3"><div class="card"><p class="mut" style="margin:0">Today</p><b style="font-size:24px">${ST[k(0)]||0}</b></div><div class="card"><p class="mut" style="margin:0">Last 7 days</p><b style="font-size:24px">${wk}</b></div><div class="card"><p class="mut" style="margin:0">All time</p><b style="font-size:24px">${all}</b></div></div><div class="card"><b>Visits per day</b><div style="display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:12px">${days.map(([d,n])=>`<div style="flex:1;text-align:center;font-size:11px"><div style="height:${Math.round(n/mx*90)}px;min-height:3px;border-radius:6px;background:linear-gradient(var(--g),#06b6d4)"></div>${n}<br><span class="mut">${d.slice(8)}</span></div>`).join('')}</div><p class="mut" style="font-size:12px">One visit means one person opening the store in one browser session.</p></div>`},
look(){const d=SITE,h=d.h1!=null?d.h1:'Pick what you love.',p=d.sub!=null?d.sub:'Simple checkout, delivered to your door. Pay with your mobile wallet.',a=d.h1s||34,b=d.subs||16,c=d.cols||2;
 return`<div class="card"><b>Preview</b><div id="pv" style="padding:16px;border-radius:14px;background:var(--bg);margin-top:8px;text-align:${d.align==='center'?'center':'left'}"><div id="pvh" style="font-weight:800;line-height:1.1;font-size:${a}px">${esc(h)}</div><div id="pvp" class="mut" style="font-size:${b}px;margin-top:8px">${esc(p)}</div></div></div>
<div class="card"><label class="lb">Headline</label><input id="lh" maxlength="80" value="${esc(h)}" oninput="pv()"><label class="lb">Sub text</label><input id="ls" maxlength="160" value="${esc(p)}" oninput="pv()"><label class="lb">Headline size: <b id="lhv">${a}</b>px</label><input id="lhs" type="range" min="18" max="60" value="${a}" oninput="pv()"><label class="lb">Sub text size: <b id="lsv">${b}</b>px</label><input id="lss" type="range" min="11" max="26" value="${b}" oninput="pv()"><label class="lb">Text position</label><select id="la" onchange="pv()"><option value="left">Left</option><option value="center" ${d.align==='center'?'selected':''}>Center</option></select><label class="lb"><input type="checkbox" id="lc" style="width:auto" ${d.chips===false?'':'checked'}> Show JazzCash / EasyPaisa badges</label><label class="lb">Products per row on phone</label><select id="lcol">${[1,2,3].map(n=>`<option value="${n}" ${c===n?'selected':''}>${n}</option>`).join('')}</select><div class="row" style="margin-top:12px;justify-content:flex-start"><button class="pri" onclick="saveLook()">Save</button><button onclick="resetLook()">Reset to default</button></div></div>`},
pay(){return['JazzCash','EasyPaisa'].map(k=>{const g=G[k]||{};return`<div class="card"><div class="row"><b>${k}</b><label><input type="checkbox" id="on-${k}" style="width:auto" ${g.on?'checked':''}> Active</label></div><input id="ti-${k}" placeholder="Account title" value="${esc(g.title)}"><input id="nu-${k}" inputmode="numeric" placeholder="03XXXXXXXXX" value="${esc(g.num)}"><button class="pri" onclick="savePay('${k}')">Save ${k}</button></div>`}).join('')+payExtra()}};
async function st(id,s){if(s!=='DELIVERED'&&!confirm(s==='PAID'?'Check in your payment app or bank that this exact amount and TID arrived. Approve?':s==='CONFIRMED'?'Confirm this order? The customer pays when it is delivered.':'Reject this order?'))return;await updateDoc(doc(db,'orders',id),{status:s})}
async function addP(){const n=$('pn').value.trim(),p=parseFloat($('pp').value),i=$('pi').value.trim(),f=$('pf').files[0];if(!n||!(p>0))return alert('Enter a name and a price above 0.');let img=i;if(f){try{img=await imgFile(f)}catch(e){return alert(e.message)}}else if(i&&!/^https:\/\//.test(i))return alert('The image link must start with https://');const c=$('pc').value.trim().slice(0,30),o=parseFloat($('po').value)||0;if(o&&o<=p)return alert('Old price must be higher than the price.');await addDoc(collection(db,'products'),{name:n,price:p,img,category:c,subcategory:$('ps').value.trim().slice(0,30),oldPrice:o,order:Date.now(),active:!$('ph').checked})}
async function editP(id){const p=PR.find(x=>x.id===id),n=prompt('Product name',p.name);if(n===null)return;const v=parseFloat(prompt('Price',p.price));if(!n.trim()||!(v>0))return alert('Enter a name and a price above 0.');const c=prompt('Category (optional)',p.category||'');if(c===null)return;const sc=prompt('Sub-category (optional)',p.subcategory||'');if(sc===null)return;const o=parseFloat(prompt('Old price (leave empty for no sale badge)',p.oldPrice||''))||0;if(o&&o<=v)return alert('Old price must be higher than the price.');await updateDoc(doc(db,'products',id),{name:n.trim(),price:v,category:c.trim().slice(0,30),subcategory:sc.trim().slice(0,30),oldPrice:o})}
const hideP=id=>updateDoc(doc(db,'products',id),{active:PR.find(x=>x.id===id).active===false}),delP=id=>confirm('Delete this product?')&&deleteDoc(doc(db,'products',id));
async function savePay(k){const t=$('ti-'+k).value.trim(),n=$('nu-'+k).value.replace(/[\s-]/g,'');if(!t)return alert('Enter the account title.');if(!/^03\d{9}$/.test(n))return alert('Number must be 11 digits, like 03001234567.');await setDoc(doc(db,'settings','payments'),{[k]:{title:t,num:n,on:$('on-'+k).checked}},{merge:true});alert(k+' saved.')}
const okImg=s=>/^(https:\/\/|data:image\/jpeg;base64,)/.test(s||'');
function imgFile(f){return new Promise((ok,no)=>{if(!f||!/^image\//.test(f.type))return no(new Error('Choose an image file.'));const r=new FileReader();r.onerror=()=>no(new Error('Could not read the image.'));r.onload=()=>{const im=new Image();im.onerror=()=>no(new Error('This image format is not supported.'));im.onload=()=>{let w=im.width,h=im.height;if(w>500||h>500){const k=500/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let q=.8,d=c.toDataURL('image/jpeg',q);while(d.length>100000&&q>.3){q-=.1;d=c.toDataURL('image/jpeg',q)}ok(d)};im.src=r.result};r.readAsDataURL(f)})}
let pid='';const pickImg=id=>{pid=id;$('pf2').value='';$('pf2').click()};
$('pf2').onchange=async()=>{try{const d=await imgFile($('pf2').files[0]);await updateDoc(doc(db,'products',pid),{img:d})}catch(e){alert(e.message||'Could not save the photo.')}};
function payExtra(){const c=G['Cash on Delivery']||{},b=G['Bank Transfer']||{};
 return`<div class="card"><div class="row"><b>Cash on Delivery</b><label><input type="checkbox" id="on-cod" style="width:auto" ${c.on?'checked':''}> Active</label></div><p class="mut">The customer pays the rider when the order arrives. No transaction ID is needed.</p><button class="pri" onclick="saveCod()">Save Cash on Delivery</button></div><div class="card"><div class="row"><b>Bank Transfer</b><label><input type="checkbox" id="on-bank" style="width:auto" ${b.on?'checked':''}> Active</label></div><input id="bk-bank" placeholder="Bank name, like HBL" maxlength="40" value="${esc(b.bank)}"><input id="bk-title" placeholder="Account title" maxlength="60" value="${esc(b.title)}"><input id="bk-num" placeholder="IBAN or account number" maxlength="40" value="${esc(b.num)}"><button class="pri" onclick="saveBank()">Save Bank Transfer</button></div>`}
async function saveCod(){await setDoc(doc(db,'settings','payments'),{'Cash on Delivery':{on:$('on-cod').checked}},{merge:true});alert('Cash on Delivery saved.')}
async function saveBank(){const bk=$('bk-bank').value.trim(),t=$('bk-title').value.trim(),n=$('bk-num').value.replace(/\s/g,'');if(!bk||!t)return alert('Enter the bank name and the account title.');if(!/^[A-Za-z0-9]{8,34}$/.test(n))return alert('Enter a valid IBAN or account number (8 to 34 letters or digits).');await setDoc(doc(db,'settings','payments'),{'Bank Transfer':{bank:bk,title:t,num:n,on:$('on-bank').checked}},{merge:true});alert('Bank Transfer saved.')}
function watchOnline(){if(vu)vu();vu=onSnapshot(query(collection(db,'visitors'),where('ts','>',new Date(Date.now()-100000))),s=>{ON=s.size;if(T==='visits')render()},()=>{})}
setInterval(()=>{if(auth.currentUser)watchOnline()},20000);
const sortP=()=>[...PR].sort((a,b)=>(a.order!=null?a.order:1e15)-(b.order!=null?b.order:1e15));
async function moveP(id,d){const A=sortP(),i=A.findIndex(x=>x.id===id),j=i+d;if(i<0||j<0||j>=A.length)return;[A[i],A[j]]=[A[j],A[i]];const b=writeBatch(db);A.forEach((p,k)=>b.update(doc(db,'products',p.id),{order:k}));await b.commit()}
const sizeP=id=>updateDoc(doc(db,'products',id),{big:!PR.find(x=>x.id===id).big});
function pv(){const g=id=>$(id).value;$('pvh').textContent=g('lh');$('pvp').textContent=g('ls');$('pvh').style.fontSize=g('lhs')+'px';$('pvp').style.fontSize=g('lss')+'px';$('lhv').textContent=g('lhs');$('lsv').textContent=g('lss');$('pv').style.textAlign=g('la')}
async function saveLook(){const g=id=>$(id).value;await setDoc(doc(db,'settings','site'),{h1:g('lh').trim().slice(0,80),sub:g('ls').trim().slice(0,160),h1s:+g('lhs'),subs:+g('lss'),align:g('la'),chips:$('lc').checked,cols:+g('lcol')},{merge:true});alert('Store look saved. Refresh the store page to see it.')}
async function resetLook(){if(confirm('Reset the store look to default?'))await setDoc(doc(db,'settings','site'),{})}
Object.assign(window,{saveCod,saveBank,moveP,sizeP,pv,saveLook,resetLook,signin,out,render,st,addP,pickImg,editP,hideP,delP,savePay,V,Q:0});
Object.defineProperty(window,'T',{get:()=>T,set:v=>T=v});Object.defineProperty(window,'Q',{get:()=>Q,set:v=>Q=v});
</script>
</body>
</html>
